<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="今日亭好" />
  <meta name="theme-color" content="#FAF7F2" />
  <title>今日亭好，勻淡風輕</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-paper: #FAF7F2;
      --sage: #7E9A78;
      --sage-light: #DCE6D8;
      --sage-soft: #EEF3EC;
      --cream-acrylic: #FFFDF8;
      --oat-wash: #F2E8D5;
      --text-main: #4F584D;
      --text-sub: #828C7F;
      --accent-gold: #C5A880;
      --accent-blush: #E4B5AC;
      --border-organic: rgba(126, 154, 120, 0.42);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Zen Maru Gothic', -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 14px calc(28px + env(safe-area-inset-bottom)) 14px;
      background-color: var(--bg-paper);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(219, 229, 214, 0.45) 0%, transparent 42%),
        radial-gradient(circle at 88% 18%, rgba(242, 232, 213, 0.55) 0%, transparent 45%),
        radial-gradient(circle at 20% 85%, rgba(242, 232, 213, 0.45) 0%, transparent 45%),
        radial-gradient(circle at 85% 88%, rgba(219, 229, 214, 0.40) 0%, transparent 42%);
      color: var(--text-main);
      min-height: 100vh;
    }

    .app-shell {
      max-width: 480px;
      margin: 0 auto;
    }

    /* 頂部標題區 */
    header {
      text-align: center;
      padding: 16px 8px 10px;
      position: relative;
    }

    .title-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 16px;
      transition: background 0.2s ease;
    }

    .title-wrap:hover, .title-wrap:active {
      background: rgba(220, 230, 216, 0.45);
    }

    h1 {
      margin: 0;
      font-size: 1.44rem;
      font-weight: 700;
      color: var(--sage);
      letter-spacing: 0.05em;
    }

    .edit-title-icon {
      color: var(--accent-gold);
      opacity: 0.85;
      flex-shrink: 0;
    }

    .subtitle-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .date-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 253, 248, 0.88);
      border: 1.5px solid var(--border-organic);
      border-radius: 20px;
      padding: 4px 12px;
      box-shadow: 0 2px 8px rgba(126, 154, 120, 0.08);
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--sage);
      font-weight: 700;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 0.9rem;
    }

    .icon-btn:active {
      background: var(--sage-soft);
    }

    /* 頂部功能工具列 */
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 10px 0 14px;
    }

    .tabs {
      display: flex;
      background: rgba(238, 243, 236, 0.85);
      padding: 4px;
      border-radius: 22px;
      border: 1.5px solid var(--border-organic);
      flex: 1;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 7px 10px;
      border-radius: 18px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--cream-acrylic);
      color: var(--sage);
      box-shadow: 0 2px 6px rgba(126, 154, 120, 0.15);
    }

    .backup-btn {
      background: var(--cream-acrylic);
      border: 1.5px solid var(--border-organic);
      color: var(--sage);
      border-radius: 18px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(126, 154, 120, 0.08);
    }

    /* 水彩壓克力卡片 */
    .card {
      background: linear-gradient(145deg, rgba(255, 253, 248, 0.94), rgba(247, 242, 232, 0.88));
      border: 1.8px solid var(--border-organic);
      border-radius: 24px 20px 26px 22px;
      padding: 15px 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(126, 154, 120, 0.07), inset 0 0 18px rgba(242, 232, 213, 0.35);
      position: relative;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--sage);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-action {
      background: var(--sage-soft);
      border: 1px solid var(--border-organic);
      color: var(--sage);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 14px;
      cursor: pointer;
    }

    /* 7日足跡圓點 */
    .week-strip {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .day-dot-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 0;
      border-radius: 14px;
    }

    .day-dot-item.selected {
      background: rgba(220, 230, 216, 0.55);
    }

    .day-dot-label {
      font-size: 0.72rem;
      color: var(--text-sub);
    }

    .day-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--border-organic);
      background: var(--cream-acrylic);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-sub);
    }

    .day-dot.done {
      background: var(--sage);
      color: #fff;
      border-color: var(--sage);
    }

    /* 喝水進度區 */
    .water-summary {
      font-size: 0.84rem;
      color: var(--text-sub);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-goal {
      background: var(--sage);
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 700;
    }

    .cups-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cup-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 54px;
      height: 60px;
      border-radius: 16px;
      border: 1.5px solid var(--border-organic);
      background: var(--cream-acrylic);
      cursor: pointer;
      transition: all 0.18s ease;
      padding: 4px;
    }

    .cup-btn.filled {
      background: linear-gradient(180deg, #E4EFE2 0%, #C8DBC3 100%);
      border-color: var(--sage);
      transform: translateY(-1px);
    }

    .cup-ml {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-main);
      margin-top: 2px;
    }

    /* 習慣清單 */
    .habit-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .habit-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--cream-acrylic);
      border: 1.5px solid var(--border-organic);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .habit-item.checked {
      background: var(--sage-soft);
      border-color: var(--sage);
    }

    .habit-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.92rem;
      font-weight: 500;
    }

    .check-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.8px solid var(--sage);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .habit-item.checked .check-circle {
      background: var(--sage);
    }

    .habit-tag {
      font-size: 0.72rem;
      color: var(--text-sub);
      background: rgba(242, 232, 213, 0.7);
      padding: 2px 8px;
      border-radius: 10px;
    }

    /* 待辦清單 */
    .todo-switch {
      display: inline-flex;
      background: var(--sage-soft);
      border-radius: 14px;
      padding: 2px;
      border: 1px solid var(--border-organic);
    }

    .todo-switch button {
      border: none;
      background: transparent;
      padding: 3px 10px;
      border-radius: 11px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-sub);
      cursor: pointer;
    }

    .todo-switch button.active {
      background: var(--cream-acrylic);
      color: var(--sage);
    }

    .add-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    input[type="text"], input[type="number"], textarea {
      border: 1.5px solid var(--border-organic);
      background: rgba(255, 253, 248, 0.95);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 0.9rem;
      color: var(--text-main);
      outline: none;
      width: 100%;
    }

    input:focus, textarea:focus {
      border-color: var(--sage);
    }

    .primary-btn {
      background: var(--sage);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .todo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: var(--cream-acrylic);
      border-radius: 14px;
      border: 1px solid rgba(126, 154, 120, 0.28);
      margin-bottom: 6px;
    }

    .todo-row.done span {
      text-decoration: line-through;
      color: var(--text-sub);
    }

    .del-btn {
      background: none;
      border: none;
      color: #B69B94;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    /* 小日記頁面 */
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .choice-chip {
      padding: 6px 12px;
      border-radius: 16px;
      border: 1.5px solid var(--border-organic);
      background: var(--cream-acrylic);
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .choice-chip.active {
      background: var(--sage-light);
      border-color: var(--sage);
      font-weight: 700;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
      background-image: linear-gradient(transparent 95%, rgba(126, 154, 120, 0.16) 95%);
      background-size: 100% 1.6rem;
    }

    /* 彈窗 Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(79, 88, 77, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: var(--bg-paper);
      border: 2px solid var(--sage);
      border-radius: 24px;
      padding: 18px;
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--sage);
      margin: 0 0 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-sub);
      margin: 10px 0 4px;
      font-weight: 700;
    }

    .preset-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--sage);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.84rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 99;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="title-wrap" id="editTitleTrigger" title="點選可自訂專屬標題">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7E9A78" stroke-width="2" stroke-linecap="round">
          <path d="M12 20C12 13 16 7 21 4C15 5 11 9 10 15"/>
          <path d="M11 13C8 10 5 9 3 9C5 12 7 14 10 15"/>
        </svg>
        <h1 id="appTitleDisplay">今日亭好，勻淡風輕</h1>
        <svg class="edit-title-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </div>
      <div class="subtitle-bar">
        <div class="date-pill">
          <button class="icon-btn" id="prevDayBtn" title="前一天">‹</button>
          <span id="currentDateLabel" style="font-weight:700;color:#4F584D;"></span>
          <button class="icon-btn" id="nextDayBtn" title="後一天">›</button>
        </div>
        <button class="mini-action" id="todayBtn">回今天</button>
      </div>
    </header>

    <div class="nav-row">
      <div class="tabs">
        <button class="tab-btn active" data-tab="home">今日總覽</button>
        <button class="tab-btn" data-tab="diary">小日記</button>
      </div>
      <button class="backup-btn" id="openBackupBtn">備份 / 還原</button>
    </div>

    <!-- 分頁一：今日總覽（首頁） -->
    <main id="homeView">
      <section class="card">
        <div class="card-header">
          <span class="card-title">本週小足跡</span>
          <span id="streakBadge" style="font-size:0.78rem;color:var(--sage);font-weight:700;"></span>
        </div>
        <div class="week-strip" id="weekStrip"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <span class="card-title">今日喝水進度</span>
          <button class="mini-action" id="openWaterModalBtn">水壺設定</button>
        </div>
        <div class="water-summary">
          <span id="waterProgressText">0 / 2000 ml</span>
          <span class="badge-goal hidden" id="waterGoalBadge">今日飲水達標</span>
        </div>
        <div class="cups-grid" id="cupsGrid"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <span class="card-title">日常小習慣</span>
          <button class="mini-action" id="openHabitModalBtn">編輯習慣</button>
        </div>
        <div class="habit-list" id="habitList"></div>
      </section>

      <section class="card">
        <div class="card-header">
          <span class="card-title">待辦小清單</span>
          <div class="todo-switch">
            <button class="active" data-todo-day="today" id="todoTabToday">今日待辦</button>
            <button data-todo-day="tomorrow" id="todoTabTomorrow">明日待辦</button>
          </div>
        </div>
        <div class="add-row">
          <input type="text" id="homeTodoInput" placeholder="新增一件待辦小事..." />
          <button class="primary-btn" id="homeAddTodoBtn">新增</button>
        </div>
        <div id="homeTodoList"></div>
      </section>
    </main>

    <!-- 分頁二：小日記 -->
    <main id="diaryView" class="hidden">
      <section class="card">
        <div class="card-header">
          <span class="card-title">今日天氣與氣溫</span>
        </div>
        <div class="chip-group" id="weatherGroup"></div>
        <input type="text" id="tempInput" placeholder="寫個氣溫或小註解（例如：24°C 微風剛剛好）" />
      </section>

      <section class="card">
        <div class="card-header">
          <span class="card-title">現在的心情</span>
        </div>
        <div class="chip-group" id="moodGroup"></div>
        <input type="text" id="moodNoteInput" placeholder="一句話形容今天的心情..." />
      </section>

      <section class="card">
        <div class="card-header">
          <span class="card-title">今日小事</span>
          <span style="font-size:0.75rem;color:var(--text-sub);">填寫後自動完成日記打卡</span>
        </div>
        <textarea id="diaryNoteInput" placeholder="記下今天發生的小美好、好吃的東西，或想對自己說的話..."></textarea>
      </section>
    </main>
  </div>

  <!-- 編輯專屬標題 Modal -->
  <div class="modal-backdrop" id="titleModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>編輯專屬日記標題</span>
        <button class="icon-btn" onclick="closeModal('titleModal')">✕</button>
      </div>
      <label class="field-label">輸入你喜歡的標題（會自動保存）</label>
      <input type="text" id="customTitleInput" placeholder="例如：今日亭好，勻淡風輕" maxlength="24" />
      <label class="field-label">快速套用靈感</label>
      <div class="preset-row">
        <button class="mini-action" onclick="setTitlePreset('今日亭好，勻淡風輕')">今日亭好，勻淡風輕</button>
        <button class="mini-action" onclick="setTitlePreset('每日打卡小日記')">每日打卡小日記</button>
      </div>
      <div style="margin-top:14px;text-align:right;">
        <button class="primary-btn" id="saveTitleBtn">儲存標題</button>
      </div>
    </div>
  </div>

  <!-- 水壺設定 Modal -->
  <div class="modal-backdrop" id="waterModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>水壺與飲水目標設定</span>
        <button class="icon-btn" onclick="closeModal('waterModal')">✕</button>
      </div>
      <label class="field-label">快速選擇水壺容量 (ml)</label>
      <div class="preset-row">
        <button class="mini-action" onclick="setBottlePreset(250)">250 ml</button>
        <button class="mini-action" onclick="setBottlePreset(350)">350 ml</button>
        <button class="mini-action" onclick="setBottlePreset(500)">500 ml</button>
        <button class="mini-action" onclick="setBottlePreset(750)">750 ml</button>
        <button class="mini-action" onclick="setBottlePreset(1000)">1000 ml</button>
      </div>
      <label class="field-label">我的水壺容量 (ml)</label>
      <input type="number" id="bottleSizeInput" min="50" max="3000" step="50" />
      <label class="field-label">每日喝水目標 (ml)</label>
      <input type="number" id="waterGoalInput" min="200" max="6000" step="100" />
      <div style="margin-top:14px;text-align:right;">
        <button class="primary-btn" id="saveWaterSettingsBtn">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- 習慣編輯 Modal -->
  <div class="modal-backdrop" id="habitModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>自訂日常習慣（不限數量）</span>
        <button class="icon-btn" onclick="closeModal('habitModal')">✕</button>
      </div>
      <div class="add-row">
        <input type="text" id="newHabitInput" placeholder="輸入新習慣名稱..." />
        <button class="primary-btn" id="addHabitBtn">新增</button>
      </div>
      <div id="editHabitList" style="display:flex;flex-direction:column;gap:8px;margin-top:8px;"></div>
    </div>
  </div>

  <!-- 備份與還原 Modal -->
  <div class="modal-backdrop" id="backupModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>資料備份與還原</span>
        <button class="icon-btn" onclick="closeModal('backupModal')">✕</button>
      </div>
      <p style="font-size:0.83rem;color:var(--text-sub);line-height:1.5;margin-top:0;">
        所有打卡與日記預設保存在此手機瀏覽器中（包含自訂標題、習慣與每日紀錄）。建議定期下載備份檔（.json），換手機或分享給朋友重新命名時都能隨時匯入還原！
      </p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
        <button class="primary-btn" id="exportBackupBtn" style="width:100%;padding:10px;">下載完整備份檔 (.json)</button>
        <label class="mini-action" style="text-align:center;padding:10px;display:block;cursor:pointer;">
          選擇備份檔還原資料
          <input type="file" id="importBackupInput" accept=".json" style="display:none;" />
        </label>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'tingyun_daily_journal_v1';

    function formatDateKey(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function addDays(key, delta) {
      const dt = parseDateKey(key);
      dt.setDate(dt.getDate() + delta);
      return formatDateKey(dt);
    }

    const defaultState = {
      settings: {
        appTitle: '今日亭好，勻淡風輕',
        bottleMl: 500,
        waterGoalMl: 2000,
        habits: [
          { id: 'h_diary', name: '寫一篇小日記', autoDiary: true },
          { id: 'h_1', name: '睡前伸展放鬆 10 分鐘', autoDiary: false },
          { id: 'h_2', name: '補充益生菌', autoDiary: false }
        ]
      },
      days: {}
    };

    let state = loadState();
    let selectedDate = formatDateKey(new Date());
    let todoViewTarget = 'today';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        const parsed = JSON.parse(raw);
        return {
          settings: { ...defaultState.settings, ...(parsed.settings || {}) },
          days: parsed.days || {}
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getDayData(dateKey) {
      if (!state.days[dateKey]) {
        state.days[dateKey] = {
          cupsFilled: 0,
          completedHabits: [],
          todos: [],
          weather: '',
          temp: '',
          mood: '',
          moodNote: '',
          diaryNote: ''
        };
      }
      return state.days[dateKey];
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    function renderHeaderAndWeek() {
      const titleText = (state.settings.appTitle || '今日亭好，勻淡風輕').trim();
      document.getElementById('appTitleDisplay').textContent = titleText;
      document.title = titleText;

      const dt = parseDateKey(selectedDate);
      const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
      const todayKey = formatDateKey(new Date());
      const tag = selectedDate === todayKey ? ' · 今天' : '';
      document.getElementById('currentDateLabel').textContent =
        `${dt.getMonth() + 1}月${dt.getDate()}日 (週${weekNames[dt.getDay()]})${tag}`;

      const strip = document.getElementById('weekStrip');
      strip.innerHTML = '';
      let streak = 0;
      for (let i = 6; i >= 0; i--) {
        const k = addDays(todayKey, -i);
        const dObj = parseDateKey(k);
        const dData = state.days[k];
        const hasActivity = dData && (
          dData.cupsFilled > 0 ||
          (dData.completedHabits && dData.completedHabits.length > 0) ||
          (dData.diaryNote && dData.diaryNote.trim().length > 0)
        );
        if (hasActivity) streak++;

        const item = document.createElement('div');
        item.className = 'day-dot-item' + (k === selectedDate ? ' selected' : '');
        item.innerHTML = `
          <span class="day-dot-label">${weekNames[dObj.getDay()]}</span>
          <div class="day-dot ${hasActivity ? 'done' : ''}">${dObj.getDate()}</div>
        `;
        item.onclick = () => {
          selectedDate = k;
          renderAll();
        };
        strip.appendChild(item);
      }
      document.getElementById('streakBadge').textContent = `近7日打卡 ${streak} 天`;
    }

    function renderWater() {
      const day = getDayData(selectedDate);
      const { bottleMl, waterGoalMl } = state.settings;
      const totalCups = Math.max(1, Math.ceil(waterGoalMl / bottleMl));
      const currentMl = day.cupsFilled * bottleMl;

      document.getElementById('waterProgressText').textContent =
        `${currentMl} / ${waterGoalMl} ml（每壺 ${bottleMl} ml）`;

      const badge = document.getElementById('waterGoalBadge');
      if (currentMl >= waterGoalMl) badge.classList.remove('hidden');
      else badge.classList.add('hidden');

      const grid = document.getElementById('cupsGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= totalCups; i++) {
        const filled = i <= day.cupsFilled;
        const btn = document.createElement('button');
        btn.className = 'cup-btn' + (filled ? ' filled' : '');
        btn.innerHTML = `
          <svg width="20" height="20" viewBox="0 0 24 24" fill="${filled ? '#7E9A78' : 'none'}" stroke="#7E9A78" stroke-width="1.8">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
          <span class="cup-ml">${bottleMl}ml</span>
        `;
        btn.onclick = () => {
          day.cupsFilled = (day.cupsFilled === i) ? i - 1 : i;
          saveState();
          renderWater();
          renderHeaderAndWeek();
        };
        grid.appendChild(btn);
      }
    }

    function renderHabits() {
      const day = getDayData(selectedDate);
      const hasDiary = Boolean((day.diaryNote && day.diaryNote.trim()) || day.mood || day.weather);
      const list = document.getElementById('habitList');
      list.innerHTML = '';

      if (state.settings.habits.length === 0) {
        list.innerHTML = `<div style="font-size:0.84rem;color:var(--text-sub);text-align:center;padding:8px;">尚未設定習慣，點右上角「編輯習慣」新增吧！</div>`;
        return;
      }

      state.settings.habits.forEach(habit => {
        const isChecked = habit.autoDiary
          ? (hasDiary || day.completedHabits.includes(habit.id))
          : day.completedHabits.includes(habit.id);

        const row = document.createElement('div');
        row.className = 'habit-item' + (isChecked ? ' checked' : '');
        row.innerHTML = `
          <div class="habit-left">
            <div class="check-circle">${isChecked ? '✓' : ''}</div>
            <span>${habit.name}</span>
          </div>
          ${habit.autoDiary ? '<span class="habit-tag">小日記連動</span>' : ''}
        `;
        row.onclick = () => {
          const idx = day.completedHabits.indexOf(habit.id);
          if (idx >= 0) day.completedHabits.splice(idx, 1);
          else day.completedHabits.push(habit.id);
          saveState();
          renderHabits();
          renderHeaderAndWeek();
        };
        list.appendChild(row);
      });
    }

    function renderTodos() {
      const targetDateKey = todoViewTarget === 'today' ? selectedDate : addDays(selectedDate, 1);
      const targetDay = getDayData(targetDateKey);
      const container = document.getElementById('homeTodoList');
      container.innerHTML = '';

      if (!targetDay.todos || targetDay.todos.length === 0) {
        container.innerHTML = `<div style="font-size:0.83rem;color:var(--text-sub);text-align:center;padding:8px;">${todoViewTarget === 'today' ? '今天' : '明天'}還沒有待辦事項喔～</div>`;
        return;
      }

      targetDay.todos.forEach((todo, index) => {
        const row = document.createElement('div');
        row.className = 'todo-row' + (todo.done ? ' done' : '');
        row.innerHTML = `
          <div style="display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;">
            <div class="check-circle" style="width:19px;height:19px;font-size:0.7rem;${todo.done ? 'background:var(--sage);' : ''}">${todo.done ? '✓' : ''}</div>
            <span style="font-size:0.9rem;">${todo.text}</span>
          </div>
          <button class="del-btn" title="刪除">✕</button>
        `;
        row.querySelector('div').onclick = () => {
          todo.done = !todo.done;
          saveState();
          renderTodos();
        };
        row.querySelector('.del-btn').onclick = () => {
          targetDay.todos.splice(index, 1);
          saveState();
          renderTodos();
        };
        container.appendChild(row);
      });
    }

    const WEATHER_OPTIONS = ['晴朗好天氣', '雲朵飄飄', '微涼有風', '綿綿小雨', '太陽公公躲起來'];
    const MOOD_OPTIONS = ['心花開', '平靜安穩', '小小確幸', '放空發呆', '有點疲憊'];

    function renderDiary() {
      const day = getDayData(selectedDate);
      const wGroup = document.getElementById('weatherGroup');
      wGroup.innerHTML = '';
      WEATHER_OPTIONS.forEach(w => {
        const btn = document.createElement('button');
        btn.className = 'choice-chip' + (day.weather === w ? ' active' : '');
        btn.textContent = w;
        btn.onclick = () => {
          day.weather = day.weather === w ? '' : w;
          saveState();
          renderDiary();
          renderHabits();
        };
        wGroup.appendChild(btn);
      });

      const mGroup = document.getElementById('moodGroup');
      mGroup.innerHTML = '';
      MOOD_OPTIONS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'choice-chip' + (day.mood === m ? ' active' : '');
        btn.textContent = m;
        btn.onclick = () => {
          day.mood = day.mood === m ? '' : m;
          saveState();
          renderDiary();
          renderHabits();
        };
        mGroup.appendChild(btn);
      });

      document.getElementById('tempInput').value = day.temp || '';
      document.getElementById('moodNoteInput').value = day.moodNote || '';
      document.getElementById('diaryNoteInput').value = day.diaryNote || '';
    }

    function renderAll() {
      renderHeaderAndWeek();
      renderWater();
      renderHabits();
      renderTodos();
      renderDiary();
    }

    // 分頁與日期控制
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById('homeView').classList.toggle('hidden', tab !== 'home');
        document.getElementById('diaryView').classList.toggle('hidden', tab !== 'diary');
      };
    });

    document.getElementById('prevDayBtn').onclick = () => {
      selectedDate = addDays(selectedDate, -1);
      renderAll();
    };
    document.getElementById('nextDayBtn').onclick = () => {
      selectedDate = addDays(selectedDate, 1);
      renderAll();
    };
    document.getElementById('todayBtn').onclick = () => {
      selectedDate = formatDateKey(new Date());
      renderAll();
    };

    // 標題自訂控制
    document.getElementById('editTitleTrigger').onclick = () => {
      document.getElementById('customTitleInput').value = state.settings.appTitle || '今日亭好，勻淡風輕';
      document.getElementById('titleModal').classList.add('open');
    };

    window.setTitlePreset = function(txt) {
      document.getElementById('customTitleInput').value = txt;
    };

    document.getElementById('saveTitleBtn').onclick = () => {
      const val = document.getElementById('customTitleInput').value.trim();
      if (val) {
        state.settings.appTitle = val;
        saveState();
        renderHeaderAndWeek();
        closeModal('titleModal');
        showToast('專屬標題已更新！');
      }
    };

    // 今日 / 明日待辦
    document.getElementById('todoTabToday').onclick = () => {
      todoViewTarget = 'today';
      document.getElementById('todoTabToday').classList.add('active');
      document.getElementById('todoTabTomorrow').classList.remove('active');
      renderTodos();
    };
    document.getElementById('todoTabTomorrow').onclick = () => {
      todoViewTarget = 'tomorrow';
      document.getElementById('todoTabTomorrow').classList.add('active');
      document.getElementById('todoTabToday').classList.remove('active');
      renderTodos();
    };

    function addTodoFromHome() {
      const input = document.getElementById('homeTodoInput');
      const text = input.value.trim();
      if (!text) return;
      const targetDateKey = todoViewTarget === 'today' ? selectedDate : addDays(selectedDate, 1);
      const targetDay = getDayData(targetDateKey);
      targetDay.todos.push({ text, done: false });
      input.value = '';
      saveState();
      renderTodos();
    }
    document.getElementById('homeAddTodoBtn').onclick = addTodoFromHome;
    document.getElementById('homeTodoInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodoFromHome();
    });

    // 小日記即時儲存
    ['tempInput', 'moodNoteInput', 'diaryNoteInput'].forEach(id => {
      document.getElementById(id).addEventListener('input', e => {
        const day = getDayData(selectedDate);
        if (id === 'tempInput') day.temp = e.target.value;
        if (id === 'moodNoteInput') day.moodNote = e.target.value;
        if (id === 'diaryNoteInput') day.diaryNote = e.target.value;
        saveState();
        renderHabits();
        renderHeaderAndWeek();
      });
    });

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    // 水壺設定
    document.getElementById('openWaterModalBtn').onclick = () => {
      document.getElementById('bottleSizeInput').value = state.settings.bottleMl;
      document.getElementById('waterGoalInput').value = state.settings.waterGoalMl;
      document.getElementById('waterModal').classList.add('open');
    };

    window.setBottlePreset = function(ml) {
      document.getElementById('bottleSizeInput').value = ml;
    };

    document.getElementById('saveWaterSettingsBtn').onclick = () => {
      const b = parseInt(document.getElementById('bottleSizeInput').value, 10);
      const g = parseInt(document.getElementById('waterGoalInput').value, 10);
      if (b >= 50 && g >= 200) {
        state.settings.bottleMl = b;
        state.settings.waterGoalMl = g;
        saveState();
        renderWater();
        closeModal('waterModal');
        showToast('已更新水壺設定');
      }
    };

    // 習慣編輯
    function renderEditHabits() {
      const container = document.getElementById('editHabitList');
      container.innerHTML = '';
      state.settings.habits.forEach((h, idx) => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:6px;align-items:center;';
        row.innerHTML = `
          <input type="text" value="${h.name}" />
          <button class="del-btn" title="移除">✕</button>
        `;
        row.querySelector('input').addEventListener('input', e => {
          h.name = e.target.value;
          saveState();
          renderHabits();
        });
        row.querySelector('.del-btn').onclick = () => {
          state.settings.habits.splice(idx, 1);
          saveState();
          renderEditHabits();
          renderHabits();
        };
        container.appendChild(row);
      });
    }

    document.getElementById('openHabitModalBtn').onclick = () => {
      renderEditHabits();
      document.getElementById('habitModal').classList.add('open');
    };

    document.getElementById('addHabitBtn').onclick = () => {
      const input = document.getElementById('newHabitInput');
      const name = input.value.trim();
      if (!name) return;
      state.settings.habits.push({
        id: 'h_' + Date.now(),
        name,
        autoDiary: false
      });
      input.value = '';
      saveState();
      renderEditHabits();
      renderHabits();
    };

    // 備份與還原
    document.getElementById('openBackupBtn').onclick = () => {
      document.getElementById('backupModal').classList.add('open');
    };

    document.getElementById('exportBackupBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const safeTitle = (state.settings.appTitle || '今日亭好').replace(/[\/:*?"<>|]/g, '_');
      a.href = url;
      a.download = `${safeTitle}_備份_${formatDateKey(new Date())}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已下載備份檔案');
    };

    document.getElementById('importBackupInput').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (imported && imported.settings && imported.days) {
            state = imported;
            saveState();
            renderAll();
            closeModal('backupModal');
            showToast('資料還原成功！');
          } else {
            alert('備份檔格式不正確喔！');
          }
        } catch (err) {
          alert('讀取備份檔失敗，請確認檔案是否完整。');
        }
      };
      reader.readAsText(file);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    renderAll();
  </script>
</body>
</html>
